name: CI

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#   pull_request:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      # [mcp] is not optional here, despite being an optional extra. Without it the tests
      # that guard the agent surface do not fail — they `importorskip` away, and the run is
      # green with test_mcp_mount.py and the memory client's two import tests never
      # executed. Those are the tests written after /mcp shipped dead twice over, so a run
      # that skips them says nothing about the one feature this server exists to provide.
      # [depth] stays out: torch is multi-gigabyte and the depth tests skip cleanly.
      - name: Install
        run: pip install -e ".[mcp,dev]"
      - name: Test
        run: pytest -q

  client-build:
    name: Client build (react-scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-server/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-server/client/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          CI: "false" # CRA treats warnings as errors when CI=true; warnings are lint noise here
