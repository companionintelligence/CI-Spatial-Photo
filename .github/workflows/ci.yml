name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  client-build:
    name: Client build (react-scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-server/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-server/client/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          CI: "false" # CRA treats warnings as errors when CI=true; warnings are lint noise here
