name: Deploy (Cloudflare)

# Manual only, deliberately. Two reasons, and the first is this repo's standing policy:
# GitHub Actions triggers here are gated because hosted compute was costing the org
# $563/month (docs/CI.md). The second is that this workflow publishes to the product domain,
# photo.ci.computer, and a deploy on every push to main is not what anyone wants from a
# repo whose checks run on local hardware.
#
#   gh workflow run deploy-cloudflare.yml --repo companionintelligence/CI-Spatial-Photo \
#     --ref main -f environment=production
#
# The equivalent from a laptop, no Actions minutes involved: scripts/deploy-cloudflare.sh
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which Worker to publish"
        type: choice
        options: [production, staging]
        default: staging
      origin_api_base:
        description: >-
          Optional, and normally left blank. Only for running this deployment as a
          single-origin proxy in front of one shared server (see wrangler.toml); the
          default design is that each browser names its own server instead.
        type: string
        required: false

concurrency:
  # Never two deploys to the same Worker at once; queue rather than cancel, because
  # cancelling mid-publish is how you get a half-uploaded asset manifest.
  group: deploy-cloudflare-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build the viewer and deploy the Worker
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      # Before anything expensive. Checkout is seconds; what this saves is the two
      # minutes of npm install and CRA build that the first real deploy attempt spent
      # before failing inside wrangler with "it's necessary to set a
      # CLOUDFLARE_API_TOKEN environment variable" — true, but it does not say *why* the
      # secret was empty, which is the only thing the operator needs to know.
      #
      # After checkout, not before, because the diagnosis below is a file in the repo.
      #
      # Presence only. The values are never echoed, and `-n` on a masked secret does not
      # reveal it.
      - name: Check the deploy credentials reached this job
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Consumed only by .github/scripts/diagnose-missing-secret.py, and only when
          # something is missing. Keys only; values are never read.
          VISIBLE_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -u
          missing=0
          # Presence only — the values are never echoed.
          if [ -n "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN: present"; else echo "CLOUDFLARE_API_TOKEN: MISSING"; missing=1; fi
          if [ -n "$CF_ACCOUNT" ]; then echo "CLOUDFLARE_ACCOUNT_ID: present"; else echo "CLOUDFLARE_ACCOUNT_ID: MISSING"; missing=1; fi
          if [ "$missing" = "1" ]; then
            echo
            python3 .github/scripts/diagnose-missing-secret.py || true
            echo
            echo "Where they must live: Settings -> Secrets and variables -> ACTIONS -> Secrets tab,"
            echo "on THIS repository (companionintelligence/CI-Spatial-Photo, renamed from CI-Photo-Time-Machine)."
            echo "  * The Dependabot and Codespaces tabs on that page are separate stores; Actions cannot read them."
            echo "  * The Variables tab is also separate - those are vars.X, not secrets.X."
            echo "  * Environment secrets only reach the environment the job declares, which here is '${{ inputs.environment }}'."
            echo "::error::A Cloudflare credential did not reach this job - see the lines above."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-server/client/package-lock.json

      - name: Install viewer dependencies
        working-directory: web-server/client
        run: npm ci --no-audit --no-fund

      - name: Build the viewer
        working-directory: web-server/client
        run: npm run build
        env:
          # Intentionally absent. Setting it — to anything, including empty — would bake a
          # server address into a bundle that is meant to ship without one and ask. See
          # web-server/client/src/utils/apiTarget.ts.
          CI: "false" # CRA treats warnings as errors when CI=true; warnings are lint noise here

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keep in step with the devDependency in package.json, so a deploy from CI and
          # one from a laptop are the same deploy.
          #
          # Not cosmetic: the action defaults to wrangler 3.90, which does not know
          # `run_worker_first` and said so — "Unexpected fields found in assets field" —
          # then carried on. A config field being silently dropped means the deployed
          # Worker would not be the one this repo tested: the API prefixes would be
          # answered from the asset store instead of by worker/index.js.
          wranglerVersion: "4.142.0"
          # `--env ""` targets the top-level config (the one that owns photo.ci.computer).
          command: >-
            deploy
            --env ${{ inputs.environment == 'production' && '""' || 'staging' }}
            ${{ inputs.origin_api_base != '' && format('--var ORIGIN_API_BASE:{0}', inputs.origin_api_base) || '' }}

      - name: Smoke test
        if: inputs.environment == 'production'
        run: |
          set -euo pipefail
          echo "Waiting for the new version to be live..."
          sleep 10
          # The viewer must be served, and the share-link route must resolve to the shell
          # rather than a 404 — the two things the edge exists to do. There is nothing to
          # check beyond that: the API lives on each user's own server, not here.
          for path in / /view/smoke-test; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://photo.ci.computer$path")
            echo "GET $path -> $code"
            [ "$code" = "200" ] || { echo "::error::photo.ci.computer$path returned $code"; exit 1; }
          done
