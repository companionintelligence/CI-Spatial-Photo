# Product video — capture the real UI, then render both cuts.
#
# Deliberately NO `push` trigger. CI-Local-CICD's policy gates always-on
# workflows (its README: "CI-Marketplace was fully gated and billing again
# within a day"), so this runs on demand and once a week.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Read by video/capture.config.mjs.
      PTM_VIEWER_URL: http://127.0.0.1:3000
      PTM_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # `scope` is required alongside `registry-url`: without it setup-node writes a
          # bare `registry=https://npm.pkg.github.com/` into ~/.npmrc, routing *every*
          # package there, so public deps like playwright 404 on install.
          registry-url: https://npm.pkg.github.com
          scope: "@companionintelligence"

      # ⚠️ THIS STEP CURRENTLY FAILS, AND IT BLOCKS EVERY SHOT IN THE VIDEO.
      # @companionintelligence/video-kit is a PRIVATE package published from
      # CI-Common. `secrets.GITHUB_TOKEN` is scoped to THIS repo, so it cannot read a
      # package owned by a different one, and npm answers:
      #   403 Forbidden - GET .../@companionintelligence%2fvideo-kit
      #   Permission permission_denied: read_package
      # Until that is resolved, `npm run capture` never runs and every shot renders as
      # the kit's "capture pending" slate. Two ways out, both ORG-level:
      #   (a) preferred — GitHub Packages > video-kit > Manage Actions access > add
      #       this repo with Read. One-time setting, no secret to rotate. The same
      #       step exists in all 12 product repos, so all 12 need the grant.
      #   (b) provision an org secret CI_PACKAGES_TOKEN (a PAT with read:packages).
      # The fallback below is INERT until (b) exists: an undefined secret is the empty
      # string, so this evaluates to secrets.GITHUB_TOKEN and behaves exactly as before.
      - name: Install video project
        working-directory: video
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CI_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # This repo has NO Playwright config to reuse, so the stage is booted by hand.
      # It is two processes (docker-compose.yml): the FastAPI server on :8000 and
      # the CRA viewer on :3000. The SPA is an empty shell without the server —
      # CreatePanel populates its Engine select from GET /api/v1/engines on mount.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Start app
        run: |
          set -euo pipefail

          # 1. Processing server. AUTH_DISABLED defaults to true (server/app/config.py);
          #    set it explicitly so a stray .env cannot turn Companion OIDC back on.
          #    PUBLIC_BASE_URL is what config.py::share_url builds the share link from.
          #    It does NOT decide what the share footer shows: video/capture.config.mjs
          #    rewrites every GET /assets and /assets/:id response in flight and pins
          #    `share_url` to https://photo-time-machine.local/view/a7989c36, and that
          #    pinned string is what App.tsx prints on camera. Setting it here is
          #    belt-and-braces — it keeps the stage presentable if that pin is ever
          #    dropped, and keeps loopback out of the copies MCP and the Companion
          #    memory hand-off echo (mcp_server.py::get_share_url, memory.py).
          pip install -e ./server
          AUTH_DISABLED=1 \
          PUBLIC_BASE_URL=https://photo-time-machine.local \
          ASSET_DIR="$PWD/.video-stage/assets" \
            nohup uvicorn app.main:app --app-dir server --host 127.0.0.1 --port 8000 \
              > "$RUNNER_TEMP/uvicorn.log" 2>&1 &

          # 2. Viewer. REACT_APP_API_BASE is baked in at CRA BUILD time (api.ts),
          #    so it must be set here, not at serve time. CI=true makes
          #    react-scripts treat warnings as errors — .github/workflows/ci.yml
          #    turns it off for the same reason.
          npm ci --no-audit --no-fund --prefix web-server/client
          CI=false REACT_APP_API_BASE=http://127.0.0.1:8000 \
            npm run build --prefix web-server/client

          # `serve -s` gives the SPA fallback that nginx.conf provides in the
          # container, so /view/:assetId resolves to index.html.
          nohup npx --yes serve -s web-server/client/build -l 3000 \
            > "$RUNNER_TEMP/serve.log" 2>&1 &

          npx --yes wait-on -t 120000 \
            http://127.0.0.1:8000/healthz \
            http://127.0.0.1:3000

      # ASSET_DIR is a fresh empty directory every run, so without this the Explore
      # tab renders "No 3D memories yet — create one above.", the viewer never has an
      # asset to load, and the share footer never mounts: three of the seven shots
      # would film an empty state. Seed exactly one asset through the REAL API.
      #
      # `engine=preview` routes explicitly to PreviewEngine (server/app/engines/registry.py
      # "explicit request wins"), which is CPU-only and needs neither CUDA nor
      # downloaded weights (server/app/engines/preview.py) — the only one of the four
      # engines that can run on ubuntu-latest. It writes a real master.ply plus a
      # thumb.webp, so the gallery tile and the orbited splat are genuine output.
      - name: Seed one 3D memory
        run: |
          set -euo pipefail
          job_id=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/jobs \
            -F files=@video/assets/media/porch-1998.png \
            -F engine=preview \
            -F intent=auto \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["job_id"])')
          echo "seed job: $job_id"

          job_status=""
          for _ in $(seq 1 60); do
            body=$(curl -sf "http://127.0.0.1:8000/api/v1/jobs/$job_id")
            job_status=$(printf '%s' "$body" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            if [ "$job_status" = "done" ]; then
              break
            fi
            if [ "$job_status" = "error" ]; then
              echo "$body"
              echo "::error::seed job failed"
              exit 1
            fi
            sleep 2
          done

          if [ "$job_status" != "done" ]; then
            echo "::error::seed job never reached done (last status: ${job_status:-none})"
            tail -50 "$RUNNER_TEMP/uvicorn.log" || true
            exit 1
          fi

          # Fail here rather than silently filming an empty gallery. A missing
          # thumbnail matters on its own: Gallery.tsx only renders the <img> when
          # `thumbnail` is set, and both viewer shots select the tile by img[alt].
          curl -sf http://127.0.0.1:8000/api/v1/assets \
            | python3 -c 'import sys,json; a=json.load(sys.stdin)["assets"]; assert a, "seed reported done but /assets is empty"; x=a[0]; assert x["thumbnail"], "seeded asset has no thumbnail; the gallery tile would be blank"; print("seeded:", x["asset_id"], x["kind"], x["engine"], sorted(x["formats"]))'

      - name: Capture
        working-directory: video
        run: npm run capture

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      # NOT redundant — do not delete. The GitHub-hosted Ubuntu runner image
      # (ubuntu-latest is ubuntu-24.04) does not ship FFmpeg, and `npm run render`
      # needs BOTH binaries: ffmpeg to encode the MP4s and ffprobe to probe the
      # media assets. Without this step the render aborts with "FFmpeg not found /
      # FFprobe not found" before writing a single frame. Guarded by the same
      # condition as Render so a capture-only run does not pay for the install.
      - name: Install FFmpeg
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-photo-time-machine-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Photo Time Machine product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
