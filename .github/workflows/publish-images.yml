name: Publish images

# Manual only, like every workflow in this org (Actions triggers are gated to
# workflow_dispatch). Builds the two images docker-compose.yml names and pushes them to GHCR.
#
#   gh workflow run publish-images.yml --repo companionintelligence/CI-Spatial-Photo \
#     --ref main -f tag=2.0.0
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (also pushed as latest)"
        type: string
        required: true
        default: "2.0.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
          - name: viewer
            context: ./web-server/client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/companionintelligence/ci-spatial-photo-${{ matrix.name }}:${{ inputs.tag }}
            ghcr.io/companionintelligence/ci-spatial-photo-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
