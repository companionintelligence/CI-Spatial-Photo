# Cloudflare Worker for photo.ci.computer — see docs/DEPLOY-CLOUDFLARE.md.
#
#   npm run deploy            # build the viewer, then deploy this Worker
#   npx wrangler deploy --dry-run   # validate config + bundle without publishing
#
# The Worker serves the built viewer and reverse-proxies the API to the processing
# server; worker/index.js explains why those two share an origin.

# Named to match the other Workers in this account (ci-os-hub-production,
# ci-cloud-app-staging, ...): the environment is in the name, explicitly.
name = "ci-spatial-photo-production"
main = "worker/index.js"
compatibility_date = "2025-09-15"
workers_dev = false

[observability]
enabled = true

[assets]
# Produced by `npm --prefix web-server/client run build` (CRA). Not in git.
directory = "web-server/client/build"
binding = "ASSETS"
# A path that is not a file is a real 404 (served from 404.html), not the app shell.
# "single-page-application" turned EVERY unknown path into a 200 with the app — /sitemap.xml,
# /llms.txt, /anything — which crawlers index as duplicate pages and monitors cannot tell
# from a working one. The one client-side route that is a page, /view/:assetId, is answered
# with the shell by name in worker/index.js instead.
not_found_handling = "404-page"
# Run worker/index.js ahead of the asset lookup for every request, so the API prefixes can
# be proxied before Cloudflare tries to find a file for them. The Worker then falls through
# to env.ASSETS.fetch() for everything else.
run_worker_first = true

[vars]
# Normally left empty, and empty is the shipped design.
#
# This deployment is a STATIC viewer: each browser names its own processing server on
# first visit and remembers it locally (web-server/client/src/utils/apiTarget.ts), so the
# edge never proxies, never sees a photo, and does not need to know where any server is.
# Unset, the Worker answers /api, /mcp and /healthz with a 503 explaining exactly that, sends
# /docs to the public docs, and answers /redoc and /openapi.json with a 404.
#
# Setting it turns the Worker into a reverse proxy in front of ONE shared server, which
# is a different product: single-origin, so no CORS and no local-network permissions, at
# the cost of every user's photos passing through one machine. Worth it for a team
# instance; wrong for a personal one. To do it:
#   npx wrangler deploy --env "" --var ORIGIN_API_BASE:https://<origin-host>
# and choose "Same host as this page" in the viewer. Not a secret — it is a public
# hostname — so a plain var is right.
ORIGIN_API_BASE = ""

[[routes]]
pattern = "photo.ci.computer"
custom_domain = true

# ── Staging ───────────────────────────────────────────────────────────────────
# `npx wrangler deploy --env staging` -> ci-spatial-photo-staging, on workers.dev, so a
# viewer build can be exercised against a real origin without touching the product domain.
[env.staging]
name = "ci-spatial-photo-staging"
workers_dev = true
# Load-bearing empty list. A wrangler environment inherits the top-level `routes`, so
# without this a staging deploy reassigns photo.ci.computer to the staging Worker — it takes
# the product domain down, from a command that reads as if it could not.
routes = []

[env.staging.assets]
directory = "web-server/client/build"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[env.staging.vars]
ORIGIN_API_BASE = ""
