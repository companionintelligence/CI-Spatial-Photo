[project]
name = "ci-photo-time-machine-server"
version = "2.0.0"
description = "Containerized, MCP-native image/video -> 3D processing server for the Companion Intelligence suite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pyjwt>=2.7",
  "cryptography>=41",
  "pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# MCP server/client surface. Kept optional so the REST API + tests run without it.
#
# Upper-bounded on purpose. `mcp` 2.0 renamed FastMCP to MCPServer and changed the tool and
# transport APIs, so `from mcp.server.fastmcp import FastMCP` — what app/mcp_server.py is
# written against — raises ModuleNotFoundError there. build_mcp() catches that and returns
# None, so an unpinned install did not fail loudly: it silently shipped a server with no MCP
# surface at all, which is the one thing this app exists to provide. Lift the bound in the
# same change that ports mcp_server.py to the 2.x API, not before.
mcp = ["mcp>=1.2,<2"]
# Monocular / video depth estimation for the depth-image and depth-video engines.
# Deliberately NOT in `dependencies`: torch is a multi-hundred-megabyte wheel (multi-gigabyte
# with CUDA) and the API, router, MCP surface and test suite all run without it — the depth
# engines just report themselves unavailable with an install hint. `pip install '.[depth]'`
# pulls the CPU/MPS wheel; for CUDA install torch from the PyTorch index first, then this extra.
# transformers 4.48 is the floor: `post_process_depth_estimation` and the Depth Pro
# architecture both land there, and without them the Depth Pro checkpoint cannot be loaded and
# the focal-length path silently degrades to the assumed 60-degree field of view.
# torchvision is here despite never being imported by this project: transformers 5's
# AutoImageProcessor hard-requires it, and its absence surfaces as an unreadable ImportError
# from inside from_pretrained rather than as a missing dependency.
depth = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.48", "safetensors>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
