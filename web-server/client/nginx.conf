server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: /view/:assetId and every other path serve the app shell.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|wasm|ply|glb)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
